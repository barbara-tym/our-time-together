<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icons/icon_1.png">

    <title>Nasz czas razem</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="page">

        <section class="counter">

            <div class="photo">
                <img
                    src="assets/images/couple.jpg"
                    alt="Nasze zdjęcie"
                >
            </div>

            <div class="timer" aria-label="Czas, który jesteśmy razem">

                <div class="timer__item">
                    <span id="years">0</span>
                    <small>lat</small>
                </div>

                <div class="timer__item">
                    <span id="months">0</span>
                    <small>miesięcy</small>
                </div>

                <div class="timer__item">
                    <span id="days">0</span>
                    <small>dni</small>
                </div>

                <div class="timer__item">
                    <span id="hours">0</span>
                    <small>godzin</small>
                </div>

                <div class="timer__item">
                    <span id="minutes">0</span>
                    <small>minut</small>
                </div>

                <div class="timer__item">
                    <span id="seconds">0</span>
                    <small>sekund</small>
                </div>

            </div>

        </section>

    </main>

    <script src="js/timer.js"></script>

</body>
</html>
